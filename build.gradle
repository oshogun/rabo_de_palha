plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

configurations {
	// Sodium as a mod for the sodiumTest task only.
	sodiumTestRuntime
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rabodepalha" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium is optional: compile the cutaway integration against it, but never require it at runtime.
	// Pass -PwithSodium to add it to the local dev runs for manual testing.
	clientCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	if (project.hasProperty('withSodium')) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}

	// JUnit 5 unit tests, run on Fabric Loader's classpath so Minecraft classes are usable.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	// The client classes and mixin configs, so ClientMixinApplyTest can apply the client mixins. The
	// client-only Minecraft jar is already on the test runtime classpath through Loom.
	testRuntimeOnly sourceSets.client.output

	sodiumTestRuntime "maven.modrinth:sodium:${project.sodium_version}"
}

configurations {
	// Keep Sodium (e.g. from -PwithSodium) off the plain test run, so it proves the vanilla path.
	testRuntimeClasspath {
		exclude group: 'maven.modrinth', module: 'sodium'
	}
}

test {
	useJUnitPlatform {
		excludeTags 'sodium'
	}
}

// Same tests with Sodium loaded as a mod, to apply the Sodium mixins. Sodium stays optional for the mod.
def sodiumTest = tasks.register('sodiumTest', Test) {
	group = 'verification'
	description = 'Applies the client mixins with Sodium loaded.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath + configurations.sodiumTestRuntime
	useJUnitPlatform {
		includeTags 'sodium'
	}
	// Loom sets fabric.classPathGroups on `test` only; without it Knot sees main and client as two mods.
	systemProperty 'fabric.classPathGroups', [sourceSets.main, sourceSets.client]
		.collectMany { [it.output.classesDirs.files, it.output.resourcesDir].flatten() }
		.join(File.pathSeparator)
	// Sodium writes config/ into the working directory; keep it out of the project root.
	def runDir = layout.buildDirectory.dir('sodiumTest').get().asFile
	workingDir = runDir
	doFirst { runDir.mkdirs() }
	shouldRunAfter tasks.named('test')
}

tasks.named('check') {
	dependsOn sodiumTest
}

// Server-side Fabric GameTests live in the "gametest" source set (src/gametest) as a separate test mod.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "rabodepalha-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

// Alias so the documented command is `./gradlew runGametest`.
tasks.register("runGametest") {
	group = "fabric"
	description = "Runs the server GameTests headlessly."
	dependsOn "runGameTest"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
